name: CI

# The full check suite — PHPUnit/PHPCS/PHPStan across PHP 8.0-8.5, Semgrep,
# the security ruleset, JS/CSS lint, SBOM freshness, Plugin Check — runs
# locally, once per branch, in bin/merge-to-main.sh (bin/gate.sh +
# bin/php-matrix.sh) before anything reaches origin. origin
# (FlexBorder/wynko-origin) is a private backup mirror and runs no CI.
#
# This workflow runs only on the public repository (FlexBorder/wynko), which
# receives one squashed commit per release via bin/release.sh. Its job is
# the one thing the local gate structurally cannot do: an independent,
# clean-room check that the shipped/stripped tree still builds, assembles
# into a ZIP, and passes Plugin Check. It does not re-run the local gate.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-verify:
    name: Release verification (shipped tree)
    runs-on: ubuntu-latest
    if: github.repository == 'FlexBorder/wynko'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: WordPress.org readiness check
        run: bin/wp-org-check.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies (production only, matches the shipped ZIP)
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install JS dependencies and build
        run: |
          npm ci
          npm run build

      - name: Assemble the installable ZIP
        run: bin/package.sh "$GITHUB_SHA"

      - name: Derive excludes from .distignore
        id: pc-excludes
        run: |
          dirs=()
          files=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -z "$line" ] && continue
            path="${line#/}"
            if [ -d "$path" ]; then
              dirs+=("$path")
            else
              files+=("$path")
            fi
          done <.distignore
          {
            echo "dirs=$(IFS=,; echo "${dirs[*]}")"
            echo "files=$(IFS=,; echo "${files[*]}")"
          } >>"$GITHUB_OUTPUT"

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          slug: wynko
          exclude-directories: ${{ steps.pc-excludes.outputs.dirs }}
          exclude-files: ${{ steps.pc-excludes.outputs.files }}
          # Every result fails the job, not just ERROR-level ones — the
          # WARNING-level checks (text-domain/slug match, bundled
          # translations, trademarks, readme completeness) are the ones
          # WordPress.org's own review draws from.
          strict: true
