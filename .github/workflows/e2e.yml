name: E2E (signup forms + caching)

# Opt-in only — never pull_request/push. This suite needs a live Laposta
# test-account secret and real network egress, neither of which a fork PR
# gets (see ci.yml's other jobs), and which have no place in the offline
# pre-commit gate either. See TECHNICAL_DEBT.md TD-070.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright e2e suite
    runs-on: ubuntu-latest
    if: github.repository != 'FlexBorder/wynko-origin'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Start wp-env
        run: npx @wordpress/env start

      - name: Run the e2e suite
        env:
          WYNKO_TEST_API_KEY: ${{ secrets.WYNKO_TEST_API_KEY }}
          WYNKO_TEST_LIST_ID: ${{ secrets.WYNKO_TEST_LIST_ID }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: artifacts/
          retention-days: 14
